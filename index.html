// ===================== شاشة البيع =====================
Screens.sale = {
  cart: {}, rp: {}, q: '', ret: false, _busy: false,
  prune(){
    const ids = new Set(DB.list('products').map(p => p.id));
    Object.keys(this.cart).forEach(id => { if (!ids.has(id)) { delete this.cart[id]; delete this.rp[id]; } });
  },
  /* سعر الإرجاع الافتراضي = سعر آخر بيع للصنف (وليس السعر الحالي)، ويمكن للمستخدم تعديله */
  retPrice(id){
    if (this.rp[id] !== undefined && this.rp[id] !== '') return Number(this.rp[id]) || 0;
    const l = DB.lastSaleLine(id), p = DB.getProduct(id);
    return l ? Number(l.price) : (p ? p.price : 0);
  },
  unit(id){ if (this.ret) return this.retPrice(id); const p = DB.getProduct(id); return p ? p.price : 0; },
  items(){ return Object.keys(this.cart).map(id => this.ret ? { id, qty:this.cart[id], price:this.retPrice(id) } : { id, qty:this.cart[id] }); },
  total(){ return DB.round(Object.keys(this.cart).reduce((s, id) => s + this.unit(id) * this.cart[id], 0)); },
  render(el){
    this.prune();
    el.innerHTML = `<button class="btn gray noprint" onclick="go('home')" style="margin-bottom:10px">⬅️ رجوع للرئيسية</button>
    <div class="sale"><section>
      <button class="btn warn" id="retBtn"></button>
      <input class="inp" id="q" placeholder="🔍 اكتب اسم الصنف هنا" value="${DB.esc(this.q)}">
      <div class="grid" id="grid"></div></section><aside class="cart" id="cart"></aside></div>`;
    el.querySelector('#retBtn').onclick = () => { this.ret = !this.ret; this.cart = {}; this.rp = {}; this.drawGrid(); this.drawCart(); };
    el.querySelector('#q').oninput = e => { this.q = e.target.value; this.drawGrid(); };
    el.querySelector('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) this.add(c.dataset.id); };
    const cart = el.querySelector('#cart');
    cart.onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const id = b.dataset.id, a = b.dataset.act;
      if (a === 'plus') this.add(id);
      else if (a === 'minus') {
        this.cart[id] = DB.round(this.cart[id]-1);
        if (this.cart[id] <= 0) { delete this.cart[id]; delete this.rp[id]; }
        UI.mark(document.getElementById('grid'), id, this.cart[id] || 0);
        this.drawCart();
      }
      else if (a === 'del') { delete this.cart[id]; delete this.rp[id]; UI.mark(document.getElementById('grid'), id, 0); this.drawCart(); }
      else if (a === 'top') { const q = document.getElementById('q'); if (q && q.scrollIntoView) q.scrollIntoView({ behavior:'smooth', block:'center' }); }
      else if (a === 'cash') this.cash();
      else if (a === 'credit') this.credit();
    };
    cart.oninput = e => {
      const t = e.target;
      if (t.dataset.rp && this.cart[t.dataset.rp] !== undefined){ this.rp[t.dataset.rp] = t.value; this.refreshTotals(); }
    };
    this.drawGrid(); this.drawCart();
  },
  drawGrid(){
    const q = this.q.trim().toLowerCase();
    const list = DB.list('products').filter(p => !q || p.name.toLowerCase().includes(q) || String(p.code).toLowerCase().includes(q));
    document.getElementById('grid').innerHTML = list.length
      ? list.map(p => UI.card(p, false, this.cart[p.id] || 0)).join('')
      : '<p class="big">لا توجد أصناف</p>';
  },
  add(id){
    const p = DB.getProduct(id), cur = this.cart[id] || 0;
    if (!p) return;
    if (!this.ret && cur + 1 > p.qty) return UI.toast('الكمية المتاحة لا تكفي', true);
    this.cart[id] = DB.round(cur + 1);
    UI.mark(document.getElementById('grid'), id, this.cart[id]);
    this.drawCart();
  },
  refreshTotals(){
    const t = this.total(), tot = document.getElementById('stot');
    if (tot) tot.textContent = DB.money(t);
    Object.keys(this.cart).forEach(id => {
      const el = document.querySelector('#cart [data-lt="' + id + '"]');
      if (el) el.textContent = DB.money(this.unit(id) * this.cart[id]);
    });
    UI.cartBar.set({ count: Object.keys(this.cart).length, total: t, label: this.ret ? '↩️ عرض المرتجع والحفظ' : '🧾 عرض الفاتورة والحفظ' });
  },
  drawCart(){
    const ids = Object.keys(this.cart), r = this.ret;
    const rows = ids.map(id => {
      const p = DB.getProduct(id), q = this.cart[id];
      const sub = r
        ? 'صافي المباع المسجّل: ' + DB.netSold(id) + ' — سعره الحالي: ' + DB.money(p.price)
        : DB.money(p.price) + ' للواحد — المتاح: ' + DB.round(p.qty);
      return `<div class="cline">
        <div class="top">
          <div class="nm">${DB.esc(p.name)}<small>${sub}</small></div>
          <button type="button" class="rm" data-act="del" data-id="${id}" aria-label="حذف الصنف">🗑️</button>
        </div>
        <div class="ctl">
          <button type="button" class="qb" data-act="minus" data-id="${id}" aria-label="إنقاص">−</button>
          <span class="qv">${q}</span>
          <button type="button" class="qb" data-act="plus" data-id="${id}" aria-label="زيادة">+</button>
          <span class="sum" data-lt="${id}">${DB.money(this.unit(id) * q)}</span>
        </div>
        ${r ? `<div class="flds"><div class="fld"><label>سعر الإرجاع للواحد (آخر سعر بيع)</label><input class="inp" type="number" inputmode="decimal" step="any" data-rp="${id}" value="${this.retPrice(id)}"></div></div>` : ''}
      </div>`;
    }).join('');
    const cart = document.getElementById('cart');
    cart.className = 'cart' + (r ? ' ret' : '');
    document.getElementById('retBtn').textContent = r ? '🛒 رجوع للبيع العادي' : '↩️ مرتجع بيع';
    cart.innerHTML = `<div class="cart-head"><h2>${r ? '↩️ فاتورة مرتجع' : '🧺 الفاتورة'}</h2>
        ${ids.length ? '<button type="button" data-act="top">⬆️ إضافة أصناف</button>' : ''}</div>
      ${rows || '<p class="big">اضغط على صورة الصنف لإضافته</p>'}
      <div class="total" id="stot"></div>
      ${r ? `<p class="hint">💰 رصيد الخزنة الآن: ${DB.money(DB.getCash())} — الرد النقدي لا يتجاوز رصيد الخزنة</p>` : ''}
      <button class="btn ${r ? 'warn' : 'ok'}" data-act="cash">${r ? '💵 مراجعة ورد المبلغ نقداً' : '💵 مراجعة وبيع نقدي'}</button>
      <button class="btn" data-act="credit">${r ? '📒 مراجعة وخصم من حساب عميل' : '📒 مراجعة وبيع آجل'}</button>`;
    this.refreshTotals();
  },
  done(msg){ this.cart = {}; this.rp = {}; this.drawCart(); this.drawGrid(); UI.toast(msg); },

  /* شاشة مراجعة الفاتورة قبل الحفظ النهائي: كل صنف بكميته وسعره وإجماليه + تحذيرات المرتجع */
  review(type, cust){
    const r = this.ret, total = this.total();
    const lines = this.items().map(i => {
      const p = DB.getProduct(i.id) || { name:'—', price:0 };
      let warn = '';
      if (r){ const net = DB.netSold(i.id); if (i.qty > net) warn = '⚠️ أكبر من صافي المباع المسجّل (' + net + ')'; }
      return { name:p.name, qty:i.qty, unit: r ? i.price : p.price, warn };
    });
    let extra;
    if (type === 'cash'){
      extra = [['طريقة الدفع', r ? 'رد نقدي من الخزنة' : 'نقدي — يدخل الخزنة']];
      if (r) extra.push(['رصيد الخزنة بعد الرد', DB.money(DB.round(DB.getCash() - total))]);
    } else {
      extra = [['العميل', cust ? cust.name : '—'], [r ? 'يُخصم من حسابه' : 'يُضاف على حسابه', DB.money(total), 'bad']];
      const bal = cust ? (Number(cust.balance) || 0) : 0;
      if (r) extra.push(['رصيده بعد العملية', UI.balText('customers', DB.round(bal - total)), bal - total < 0 ? 'bad' : '']);
    }
    return UI.confirmInvoice({
      title: r ? '↩️ مراجعة فاتورة المرتجع' : (type === 'cash' ? '🛒 مراجعة البيع النقدي' : '📒 مراجعة البيع الآجل'),
      lines, total, extra, cls: r ? 'warn' : 'ok',
      yes: r ? 'تأكيد حفظ المرتجع نهائياً' : 'تأكيد حفظ الفاتورة نهائياً'
    });
  },
  async cash(){
    if (!this.items().length) return UI.toast('الفاتورة فارغة', true);
    if (this._busy) return;
    if (this.ret && this.total() > DB.getCash()) return UI.toast('رصيد الخزنة (' + DB.money(DB.getCash()) + ') لا يكفي لرد المبلغ — اختر الخصم من حساب عميل أو عدّل السعر', true);
    if (!(await this.review('cash'))) return;
    this._busy = true;
    try {
      const r = this.ret ? DB.returnSale(this.items(), 'cash') : DB.completeSale(this.items(), 'cash');
      if (r.error) return UI.toast(r.error, true);
      this.done(this.ret ? 'تم حفظ المرتجع ✔' : 'تم حفظ الفاتورة نهائياً ✔');
    } finally { this._busy = false; }
  },
  credit(){
    if (!this.items().length) return UI.toast('الفاتورة فارغة', true);
    const custs = DB.list('customers');
    const m = UI.modal(`<h2>اختر العميل</h2>
      ${custs.map(c => `<button class="btn" data-c="${c.id}">${DB.esc(c.name)}<br><small>${UI.balText('customers', c.balance)}</small></button>`).join('')}
      <h2>➕ عميل جديد</h2>
      <input class="inp" id="cn" placeholder="الاسم"><input class="inp" id="cp" type="tel" placeholder="رقم الهاتف">
      <button class="btn ok" id="cadd">متابعة للمراجعة</button><button class="btn gray" id="cx">رجوع</button>`);
    /* who: {id} لعميل موجود أو {name, phone} لعميل جديد (لا يُحفظ إلا بعد تأكيد الفاتورة) */
    const sell = async who => {
      if (this._busy) return;
      const cust = who.id ? custs.find(c => c.id === who.id) : { name: who.name, balance: 0 };
      if (!(await this.review('credit', cust))) return;      // رجوع للتعديل: تبقى قائمة العملاء مفتوحة
      this._busy = true;
      try {
        const id = who.id || DB.addCustomer({ name:who.name, phone:who.phone, address:'', balance:0, notes:'' }).id;
        const r = this.ret ? DB.returnSale(this.items(), 'credit', id) : DB.completeSale(this.items(), 'credit', id);
        if (r.error) return UI.toast(r.error, true);
        m.close(); this.done(this.ret ? 'تم الخصم من حساب العميل ✔' : 'تم حفظ البيع الآجل ✔');
      } finally { this._busy = false; }
    };
    m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => sell({ id: b.dataset.c }));
    m.querySelector('#cx').onclick = () => m.close();
    m.querySelector('#cadd').onclick = () => {
      const n = m.querySelector('#cn').value.trim();
      if (!n) return UI.toast('اكتب اسم العميل', true);
      sell({ name:n, phone:m.querySelector('#cp').value.trim() });
    };
  }
};

// ===================== اختصارات الفتح السريع =====================
function openQuick(screen, opts){
  const s = Screens[screen];
  if (!s) return;
  if (opts){
    if ('ret' in opts){ s.ret = opts.ret; s.cart = {}; if (s.rp) s.rp = {}; if ('paid' in s) s.paid = null; }
    else if (s.ret && s.cart && !Object.keys(s.cart).length) s.ret = false;   // دخول من الرئيسية بدون فاتورة معلّقة = وضع عادي
    if ('low' in opts) s.low = opts.low;
  }
  go(screen);
  if (opts && opts.showInvoices && typeof s.showInvoices === 'function'){
    s.showInvoices();
  }
}

            <span class="dash-icon">🛒</span> <span>فواتير المبيعات</span>

          <button class="dash-btn" onclick="openQuick('purchases', {ret:false})">

// ===================== الثيمات =====================
const THEMES = {
  sage:  { n:'🌿 أخضر هادئ', '--bg':'#f3f6f1','--card':'#ffffff','--ink':'#2f3a35','--line':'#d5ddd3','--soft':'#e3efe7','--foot':'#3c4a46','--ok':'#4a8268','--blue':'#52799c','--warn':'#bf7a3f','--bad':'#b5524c' },
  sky:   { n:'🌊 أزرق فاتح', '--bg':'#eef4f8','--card':'#ffffff','--ink':'#2c3a45','--line':'#d0dde6','--soft':'#e1edf5','--foot':'#37495a','--ok':'#4a8a8a','--blue':'#52799c','--warn':'#bf7a3f','--bad':'#b5524c' },
  sand:  { n:'🏜️ رملي دافئ', '--bg':'#faf6ee','--card':'#fffdf8','--ink':'#3b3630','--line':'#e3dccb','--soft':'#f1ead8','--foot':'#4a433a','--ok':'#6f8a4f','--blue':'#6a7f9a','--warn':'#c27d3e','--bad':'#b5524c' },
  night: { n:'🌙 ليلي مريح', '--bg':'#1f262b','--card':'#2a333a','--ink':'#e6ebe8','--line':'#3b464e','--soft':'#34413f','--foot':'#161c20','--ok':'#5a9a7c','--blue':'#5f8fb5','--warn':'#c98b4e','--bad':'#c0625c' }
};

function applyTheme(){
  const t = DB.getTheme(), base = THEMES[t.name] || THEMES.sage;
  const v = Object.assign({}, base);
  if (t.bg) v['--bg'] = t.bg;
  if (t.ok) v['--ok'] = t.ok;
  Object.keys(v).forEach(k => { if (k[0] === '-') document.documentElement.style.setProperty(k, v[k]); });
}

const themeBtnHTML = `<button id="themeBtn" class="hide">ثيم</button>`;
document.body.insertAdjacentHTML('beforeend', themeBtnHTML);
document.getElementById('themeBtn').onclick = () => {
  const m = UI.modal(`<h2>🎨 اختر الألوان</h2>
    ${Object.keys(THEMES).map(k => `<button class="btn" data-t="${k}" style="background:${THEMES[k]['--ok']}">${THEMES[k].n}</button>`).join('')}
    <button class="btn gray" id="cx">رجوع</button>`);
  m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    DB.setTheme({ name: b.dataset.t }); applyTheme(); m.close();
  });
  m.querySelector('#cx').onclick = () => m.close();
};

// ===================== التنقل =====================
function go(name){
  if (window.UI && UI.cartBar) UI.cartBar.hide();        // الشريط السفلي خاص بشاشتي البيع والشراء فقط
  // تحديث جديد للتطبيق جاهز: نطبقه عند الرجوع للرئيسية حتى لا نقطع عملية بيع في المنتصف
  if (name === 'home' && window.__swUpdated){ location.reload(); return; }
  // لو انتهى الاشتراك أثناء تشغيل التطبيق نرجع لشاشة التفعيل
  if (typeof License !== 'undefined' && License.check && !License.check()) return;
  const app = document.getElementById('app'), s = Screens[name];
  if (s) s.render(app);
  window.scrollTo(0, 0);
}

function afterLicense(){
  // أول تشغيل: اختيار مكان الحفظ على الجهاز، ثم نكمل الإعداد/الرئيسية
  if (typeof Disk !== 'undefined' && !Disk._started){ Disk.start(afterLicense); return; }
  const app = document.getElementById('app');
  if (!DB.isSetupDone()) {
    Setup.render(app, afterLicense); return;
  }
  go('home');
}
window.afterLicense = afterLicense;

// ===================== فحص تحميل الملفات =====================
const MODULES = [
  ['globals.js',   () => window.UI && window.Screens && Object.keys(window.UI).length],
  ['db.js',        () => typeof DB !== 'undefined'],
  ['disk.js',      () => typeof Disk !== 'undefined'],
  ['license.js',   () => typeof License !== 'undefined' && typeof License.gate === 'function'],
  ['setup.js',     () => typeof Setup !== 'undefined'],
  ['parties.js',   () => typeof window.makeParties === 'function'],
  ['suppliers.js', () => !!Screens.suppliers],
  ['customers.js', () => !!Screens.customers],
  ['purchases.js', () => !!Screens.purchases],
  ['inventory.js', () => !!Screens.inventory],
  ['stocktake.js', () => !!Screens.stocktake],
  ['daily.js',     () => !!Screens.daily],
  ['gallery.js',   () => !!Screens.gallery]
];

async function hardRefresh(){
  // يمسح كاش التطبيق فقط — بيانات المحل في localStorage لا تُمس
  try {
    if ('serviceWorker' in navigator){
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
    if (window.caches){
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
  } catch(e){}
  location.reload();
}

function showLoadError(missing){
  document.getElementById('app').innerHTML = `<div class="box">
    <h1>⚠️ تعذر تحميل بعض ملفات التطبيق</h1>
    <p class="big">الملفات: <bdi dir="ltr">${missing.join(' ، ')}</bdi></p>
    <p class="hint">غالباً نسخة قديمة محفوظة في المتصفح أو انقطاع الإنترنت أثناء التحميل. بيانات المحل لن تتأثر.</p>
    <button class="btn ok" onclick="hardRefresh()">🔄 تحديث التطبيق ومسح الكاش</button></div>`;
}

function boot(){
  const missing = MODULES.filter(m => { try { return !m[1](); } catch(e){ return true; } }).map(m => m[0]);
  if (missing.length) return showLoadError(missing);
  Promise.resolve(License.gate(afterLicense)).catch(err => {
    console.error(err);
    document.getElementById('app').innerHTML = '<div class="box"><h1>⚠️ حدث خطأ أثناء التشغيل</h1><button class="btn ok" onclick="hardRefresh()">🔄 تحديث التطبيق</button></div>';
  });
}

// أخطاء غير متوقعة: رسالة قصيرة بدل شاشة صامتة
let _errAt = 0;
function softError(){
  if (Date.now() - _errAt < 4000 || !window.UI || !UI.toast) return;
  _errAt = Date.now();
  UI.toast('حدث خطأ غير متوقع — أعد المحاولة', true);
}
window.addEventListener('error', e => { if (e.target === window) softError(); });
window.addEventListener('unhandledrejection', softError);

// تسجيل الـ Service Worker وتفعيل التحديث التلقائي
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;                     // أول تثبيت، لا حاجة لإعادة تحميل
      window.__swUpdated = true;
      UI.toast('🔄 يوجد تحديث جديد — سيُطبَّق عند الرجوع للرئيسية');
    });
  });
}

// تحديث الساعة
function updateDateTime() {
  const el = document.getElementById('dtDisplay');
  if (!el) return;
  const now = new Date();
  const date = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' });
  const time = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  const txt = `${date} - ${time}`;
  if (el.textContent !== txt) el.textContent = txt;
}
setInterval(updateDateTime, 1000);
updateDateTime();

try { applyTheme(); } catch(e){ console.error(e); }
boot();
</script>
</body>
</html>
